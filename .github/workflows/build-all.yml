name: Build & Release Multiplataforma (Windows, macOS, Linux)

on:
  workflow_dispatch: # Permite disparar manualmente na aba Actions do GitHub
    inputs:
      tag_name:
        description: 'Tag da Release (vazio = versão do package.json, ex: v1.7.1)'
        required: false
        default: ''
      release_title:
        description: 'Título da Release (vazio = MLab v<versão>)'
        required: false
        default: ''
  pull_request: # Validação automática apenas em Pull Requests destinados à main
    branches:
      - main
  push:
    tags:
      - 'v*' # Dispara automaticamente ao criar uma tag de versão (ex: v1.7.1)

# Os instaladores (~510 MB por run) não passam por artefatos do Actions: a cota de armazenamento da conta é menor que
# um run (#80, #112, #123). Na tag/dispatch, cada build envia os próprios instaladores direto para uma release em
# rascunho, e ela só é publicada quando os três builds passam. Em PR o build só valida.
jobs:
  prepare:
    name: Preparar release (rascunho)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release_vars.outputs.tag }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Determinar Versão da Release
        id: release_vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            TAG_NAME="${{ github.event.inputs.tag_name }}"
            DEFAULT_TITLE="MLab $TAG_NAME"
            if [[ "$TAG_NAME" == https-v* ]]; then DEFAULT_TITLE="MLab HTTPS ${TAG_NAME#https-v}"; fi
            TITLE="${{ github.event.inputs.release_title }}"
            echo "title=${TITLE:-$DEFAULT_TITLE}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "title=MLab $TAG_NAME" >> $GITHUB_OUTPUT
          else
            PKG_VER=$(node -p "require('./package.json').version") || { echo "Versão do package.json não encontrada"; exit 1; }
            echo "tag=v$PKG_VER" >> $GITHUB_OUTPUT
            echo "title=MLab v$PKG_VER" >> $GITHUB_OUTPUT
          fi

      - name: Criar a release em rascunho com as notas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_vars.outputs.tag }}
          TITLE: ${{ steps.release_vars.outputs.title }}
        run: |
          NOTES="docs/releases/$TAG.md"
          NOTES_ARGS=()
          if [ -f "$NOTES" ]; then
            echo "Notas da release: $NOTES"
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            echo "::warning::$NOTES não existe; a release sai só com as notas automáticas."
          fi

          IS_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo "none")
          if [ "$IS_DRAFT" = "false" ]; then
            echo "::error::A release $TAG já está publicada. Use outra versão ou apague a release antes de repetir."
            exit 1
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "Reaproveitando o rascunho existente de $TAG."
            if [ -f "$NOTES" ]; then gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"; fi
          else
            # --generate-notes acrescenta a lista automática de PRs depois do texto de --notes-file.
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" --generate-notes "${NOTES_ARGS[@]}"
          fi

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.os }})
    needs: prepare
    # Em PR o prepare é pulado e o build roda mesmo assim, só para validar.
    if: ${{ !cancelled() && needs.prepare.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_cmd: npm --prefix apps/desktop run make:win
            release_files: apps/desktop/dist/*.exe apps/desktop/dist/*.exe.blockmap
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm --prefix apps/desktop run make:linux
            release_files: apps/desktop/dist/*.AppImage apps/desktop/dist/*.deb
          - os: macos-latest
            platform: macos
            build_cmd: npm --prefix apps/desktop run make:mac
            release_files: apps/desktop/dist/*.dmg apps/desktop/dist/*.zip

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Go (versão do go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Instalar dependências do monorepo
        run: npm install

      - name: Instalar dependências de sistema para Linux (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools desktop-file-utils

      - name: Compilar pacotes compartilhados (@mlab/types)
        run: npm run build

      - name: Verificar tipos e go vet (lint)
        run: npm run lint

      - name: Executar testes automatizados
        run: npm run test

      # O detector de race exige cgo (indisponível no runner Windows); roda uma vez, na perna Linux (036/C-3603).
      - name: Testes da sinalização com detector de race (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/backend
        run: go test -race ./internal/signaling/ ./cmd/server/

      - name: Build do instalador nativo (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_cmd }}

      - name: Enviar os instaladores para a release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_FILES: ${{ matrix.release_files }}
        run: |
          shopt -s nullglob
          FILES=( $RELEASE_FILES )
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::Nenhum instalador encontrado em: $RELEASE_FILES"
            exit 1
          fi
          printf 'Enviando %s\n' "${FILES[@]}"
          gh release upload "$TAG" "${FILES[@]}" --clobber

  publish:
    name: Publicar GitHub Release
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tirar a release do rascunho
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # Edição MLab HTTPS (ADR 0008): a release https-* nunca tira o selo "Latest" da versão principal.
          if [[ "$TAG" == https-* ]]; then LATEST="--latest=false"; else LATEST="--latest"; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "$LATEST"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets -q '"Publicada: \(.url)\n" + ([.assets[].name] | join("\n"))'
