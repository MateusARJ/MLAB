name: Build & Release Multiplataforma (Windows, macOS, Linux)

on:
  workflow_dispatch: # Permite disparar o build manualmente no GitHub
  push:
    tags:
      - 'v*' # Dispara automaticamente ao criar uma tag de versao (ex: v0.0.1)

jobs:
  build:
    name: Build para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias do monorepo
        run: npm install

      - name: Compilar pacotes compartilhados (@mlab/types)
        run: npm run build

      - name: Build do instalador nativo (${{ matrix.os }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npx electron-builder --publish never

      - name: Fazer upload dos instaladores gerados
        uses: actions/upload-artifact@v4
        with:
          name: mlab-desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
