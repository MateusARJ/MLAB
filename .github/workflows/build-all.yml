name: Build & Release Multiplataforma (Windows, macOS, Linux)

on:
  workflow_dispatch: # Permite disparar manualmente na aba Actions do GitHub
    inputs:
      tag_name:
        description: 'Tag da Release (vazio = versão do package.json, ex: v1.7.1)'
        required: false
        default: ''
      release_title:
        description: 'Título da Release (vazio = MLab v<versão>)'
        required: false
        default: ''
  pull_request: # Validação automática apenas em Pull Requests destinados à main
    branches:
      - main
  push:
    tags:
      - 'v*' # Dispara automaticamente ao criar uma tag de versão (ex: v1.7.1)

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            build_cmd: npm --prefix apps/desktop run make:win
            artifact_name: mlab-windows
            artifact_path: apps/desktop/dist/*.exe*
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm --prefix apps/desktop run make:linux
            artifact_name: mlab-linux
            artifact_path: |
              apps/desktop/dist/*.AppImage
              apps/desktop/dist/*.deb
              apps/desktop/dist/*.tar.gz
          - os: macos-latest
            platform: macos
            build_cmd: npm --prefix apps/desktop run make:mac
            artifact_name: mlab-macos
            artifact_path: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configurar Go (versão do go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: Instalar dependências do monorepo
        run: npm install

      - name: Instalar dependências de sistema para Linux (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools desktop-file-utils

      - name: Compilar pacotes compartilhados (@mlab/types)
        run: npm run build

      - name: Verificar tipos e go vet (lint)
        run: npm run lint

      - name: Executar testes automatizados
        run: npm run test

      - name: Build do instalador nativo (${{ matrix.platform }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_cmd }}

      - name: Fazer upload dos instaladores (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Criar GitHub Release
    needs: build
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Download de todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: Determinar Versão da Release
        id: release_vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=${{ github.event.inputs.release_title || format('MLab {0}', github.event.inputs.tag_name) }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "title=MLab $TAG_NAME" >> $GITHUB_OUTPUT
          else
            PKG_VER=$(node -p "require('./package.json').version") || { echo "Versão do package.json não encontrada"; exit 1; }
            echo "tag=v$PKG_VER" >> $GITHUB_OUTPUT
            echo "title=MLab v$PKG_VER" >> $GITHUB_OUTPUT
          fi

      - name: Preparar Tag Limpa (Ocultar Código-Fonte da Release)
        run: |
          TAG="${{ steps.release_vars.outputs.tag }}"
          
          # Salva os artefatos compilados fora da árvore git
          mkdir -p /tmp/mlab-dist-release
          cp -r dist-release/* /tmp/mlab-dist-release/
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Cria um commit órfão limpo sem arquivos de código
          git checkout --orphan release-clean-tree
          git rm -rf .
          
          cat << 'EOF' > README.md
          # MLab - Downloads Oficiais da Versão

          Esta release disponibiliza exclusivamente os instaladores executáveis compilados do MLab.
          Por favor, baixe o instalador correspondente ao seu sistema operacional na seção Assets desta Release abaixo:
          - Windows: instalador executável (.exe)
          - Linux: pacote (.AppImage ou .deb)
          - macOS: pacote (.dmg ou .zip)
          EOF

          git add README.md
          git commit -m "release: ${TAG} (distribuicao oficial de binarios)"
          
          # Aponta a tag para este commit limpo (zero codigo-fonte)
          git tag -a "${TAG}" -m "Release ${TAG}" -f
          git push origin "${TAG}" --force
          
          # Restaura os artefatos para upload nos assets
          mkdir -p dist-release
          cp -r /tmp/mlab-dist-release/* dist-release/

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_vars.outputs.tag }}
          name: ${{ steps.release_vars.outputs.title }}
          draft: false
          prerelease: false
          files: |
            dist-release/**/*.exe
            dist-release/**/*.blockmap
            dist-release/**/*.AppImage
            dist-release/**/*.deb
            dist-release/**/*.tar.gz
            dist-release/**/*.dmg
            dist-release/**/*.zip
          generate_release_notes: true
